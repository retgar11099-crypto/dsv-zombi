<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101410" />
    <title>DSV-Zombi — сервер войны и зомби - нет соединения</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: #101410; color: #e7ecf5; font: 16px/1.6 system-ui, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
      .card { max-width: 440px; }
      .glyph { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.16); font: 700 30px/1 system-ui, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { margin: 0 0 20px; color: #9aa7bd; }
      button { padding: 11px 20px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph">!</div>
      <h1>DSV-Zombi — сервер войны и зомби</h1>
      <p>Нет соединения с сервером. Проверь интернет и попробуй снова.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
